data:
  train_path: data/raw/train.csv
  later_path: data/raw/later.csv
  holdout_path: data/raw/holdout_features.csv
  processed_path: data/processed/train_clean.csv

target:
  column: entries_per_hour

features:
  numerical:
    - hour
    - nearby_offices
    - temp_c
    - rain_mm
    - feeder_buses
    - ticket_price_rs
  categorical:
    - day_type
    - line

model:
  name: RandomForestRegressor
  random_state: 42
  n_estimators: 200
  max_depth: 12

monitoring:
  psi_bins: 10
  promotion_threshold: 0.12
